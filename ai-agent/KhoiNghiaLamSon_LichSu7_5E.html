<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hành trình Khởi nghĩa Lam Sơn — Lịch sử 7 (5E · THCS)</title>
<!--
  Ứng dụng học tập 5E — Khởi nghĩa Lam Sơn · Lịch sử 7 · hướng Trung học cơ sở
  Một tệp HTML duy nhất · vanilla JavaScript · chạy được khi tắt mạng.
  Toàn bộ nội dung bài học nằm giữa các mốc /* ===DATA START=== */ và /* ===DATA END=== */.
  Dữ liệu nguồn: Bo5_LichSu7_NoiDungApp.xlsx (NganHang10Cau, MocThoiGian, DiaDanh, KichBanHoatHinh)
  và tệp hướng dẫn 5E_App_Design_Instructions.html (hợp đồng chung, mục 5, 6, 7).
-->
<style>
/* ==== Bảng màu và chữ theo hướng THCS — tệp hướng dẫn, mục 4 ==== */
:root{
  --bg-0:#F4F8FD; --bg-1:#FFFFFF; --bg-2:#E8F1FB; --border:#C7DAF0;
  --text-1:#16232E; --text-2:#5B6B7A;
  --accent:#2E86DE; --accent-strong:#1B5FA8; --accent-soft:rgba(46,134,222,.14);
  --success:#22A45D; --success-soft:#E8F7EE;
  --error:#E05252; --error-soft:#FBEAEA;
  --warning:#F0A202; --gold:#F5B301;
  --fs-body:17px; --fs-question:20px; --btn-h:48px; --r-lg:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-0);color:var(--text-1);
     font:var(--fs-body)/1.6 'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,Arial,sans-serif}
button{font-family:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 14px}

/* ==== Thanh đầu trang ==== */
.topbar{background:linear-gradient(135deg,#1B5FA8,#2E86DE);color:#fff;padding:16px 0 14px}
.topbar h1{margin:0;font-size:21px;line-height:1.3}
.topbar .sub{margin:2px 0 10px;font-size:14px;opacity:.92}
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#FFD666;border-radius:99px;transition:width .5s}
.badgebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
       border-radius:99px;padding:2px 10px;font-size:13px;opacity:.5;transition:.3s}
.badge.co{opacity:1;background:rgba(255,214,102,.95);color:#5B4300;border-color:#FFD666;font-weight:700}

/* ==== Thanh điều hướng pha ==== */
.nav{position:sticky;top:0;z-index:30;display:flex;gap:6px;overflow-x:auto;
     padding:10px 12px;background:var(--bg-0);border-bottom:1px solid var(--border);
     scrollbar-width:thin}
.chip{flex:0 0 auto;min-height:40px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--border);
      background:var(--bg-1);color:var(--text-2);font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip:not(:disabled):not(.cur):hover{border-color:var(--accent);color:var(--accent-strong)}

/* ==== Khối chung ==== */
.card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r-lg);
      padding:16px;margin:14px 0;box-shadow:0 1px 4px rgba(22,35,46,.06)}
.card>h2{margin:0 0 6px;font-size:19px;color:var(--accent-strong)}
.card>h2 .doi{color:var(--text-2);font-weight:600;font-size:15px}
.lead{color:var(--text-2);font-size:15.5px;margin:0 0 10px}
hr{border:none;border-top:1px dashed var(--border);margin:14px 0}
.q{font-size:var(--fs-question);font-weight:700;line-height:1.45;margin:6px 0 10px}
.small{font-size:14px;color:var(--text-2)}
.center{text-align:center}

/* ==== Nút bấm — cao tối thiểu 48px ==== */
.btn{min-height:var(--btn-h);border-radius:12px;border:2px solid var(--accent);
     background:var(--bg-1);color:var(--accent-strong);font-size:16.5px;font-weight:600;
     padding:9px 16px;cursor:pointer;line-height:1.35;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:var(--border);color:var(--text-2)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent-strong);background:var(--bg-1)}
.btn.big{width:100%;font-size:18px;min-height:54px}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--border);color:var(--text-2);background:var(--bg-1)}
.btn.pri:disabled{background:var(--bg-2);color:var(--text-2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}

/* Phương án trả lời */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;margin:9px 0;
     min-height:var(--btn-h);padding:10px 14px;border-radius:12px;border:2px solid var(--border);
     background:var(--bg-1);color:var(--text-1);font-size:16.5px;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:not-allowed;opacity:.85}
.opt .och{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);
          display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:1px}
.opt.ok{border-color:var(--success);background:var(--success-soft)}
.opt.ok .och{border-color:var(--success);background:var(--success);color:#fff}
.opt.sel-ok{border-color:var(--accent);background:var(--accent-soft)}
.field{margin:10px 0}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
.field input{width:100%;min-height:48px;border:2px solid var(--border);border-radius:12px;
  padding:10px 14px;font-size:17px;font-family:inherit;color:var(--text-1);background:var(--bg-1)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.timerchip{display:flex;align-items:center;gap:10px;background:var(--bg-2);border-radius:12px;
  padding:6px 12px;width:fit-content;font-size:19px;font-weight:800;color:var(--accent-strong);margin:6px 0}
.timerchip .btn{min-height:40px;padding:4px 12px;font-size:14px}
.opt.ko{border-color:var(--error);background:var(--error-soft)}
.opt.ko .och{border-color:var(--error);background:var(--error);color:#fff}
.why{background:var(--bg-2);border-left:4px solid var(--accent);border-radius:8px;
     padding:10px 14px;font-size:16px;margin:10px 0}
.why b{color:var(--accent-strong)}
.feedback-ok{color:var(--success);font-weight:700}
.feedback-ko{color:var(--error);font-weight:700}
.qmeta{font-size:14.5px;color:var(--text-2);margin:0 0 4px}

/* ==== Hoạt hình pha 1 ==== */
.stage{width:100%;max-width:330px;margin:0 auto;display:block;background:#DCEBF9;
       border-radius:12px;border:1px solid var(--border)}
.stage svg{display:block;width:100%;height:auto}
.scenetitle{font-size:16px;font-weight:800;color:var(--accent-strong);text-align:center;margin:10px 0 2px}
.loidan{min-height:54px;text-align:center;font-size:17px;margin:4px auto 10px;max-width:46ch}
.ctl{display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center}
.ctl .btn{min-height:48px;padding:7px 11px;font-size:15.5px}
.ctl .btn.main{min-width:96px;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
.ctl .btn.main:hover:not(:disabled){background:var(--accent-strong)}
.ctl .btn:disabled{opacity:.4}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);background:transparent;
     padding:0;cursor:pointer;transition:.2s}
.dot.seen{background:var(--accent-soft)}
.dot.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.status{text-align:center;color:var(--text-2);font-size:15px;margin-top:8px;font-weight:600}
.khint{text-align:center;font-size:13px;color:var(--text-2);margin-top:4px}
@media (hover:none),(pointer:coarse){.khint{display:none}}
@media (max-width:429px){.ctl .btn:not(.main) .ctl-txt{display:none}.ctl .btn{padding:7px 10px}}

/* Cảnh hoạt hình trên bản đồ */
#p1-land,#a-land{fill:#F8F3E7;stroke:#B9CCE0;stroke-width:2;transition:fill .8s}
#p1-split.go{transform:translate(-52px,-44px);opacity:0}
svg.toi #p1-land{fill:#93A5B6;stroke:#7C8FA0}
svg.vang #p1-land,svg.vang #a-land{fill:#FFE7A3;stroke:#E8C25A}
.rdot{fill:#E05252;animation:blink 1.15s infinite}
@keyframes blink{50%{opacity:.12}}
#p1-ring{fill:none;stroke:#6B7B8A;stroke-width:4;transform-box:fill-box;transform-origin:center}
#p1-ring.si{animation:squeeze 1.8s ease-in-out infinite alternate}
@keyframes squeeze{from{transform:scale(1.25)}to{transform:scale(.72)}}
#p1-bigtxt{font-size:46px;font-weight:800;fill:#B07800;text-anchor:middle}
.fade{transition:opacity .7s}
#p1-split{transition:transform 1.6s ease,opacity 1.6s ease}
.mrk{transition:opacity .5s}
.hide-el{opacity:0;pointer-events:none}
.glow{filter:drop-shadow(0 0 6px rgba(245,179,1,.85))}
@media (prefers-reduced-motion:reduce){
  .rdot,#p1-ring.si{animation:none}
  .fin{transition:none!important}
}

/* ==== Bản đồ trạm A ==== */
.tickrow{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-top:2px}
input[type=range]{width:100%;accent-color:var(--accent);height:40px;margin:2px 0 0}
.yearchip{display:inline-block;background:var(--accent-soft);color:var(--accent-strong);
          font-weight:800;font-size:22px;border-radius:10px;padding:2px 14px}
.moccard{background:var(--bg-2);border-radius:10px;padding:10px 14px;margin-top:10px}
.moccard b{color:var(--accent-strong)}
.diadanh{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ddchip{background:var(--bg-1);border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:14.5px}
.ddchip b{color:var(--accent-strong)}

/* ==== Trạm B ==== */
.pa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:540px){.pa-grid{grid-template-columns:1fr}}
.stepwrap{list-style:none;counter-reset:st;padding:0;margin:10px 0}
.stepwrap li{position:relative;padding:8px 0 8px 40px;margin:0;opacity:.22;transition:opacity .4s}
.stepwrap li.on{opacity:1}
.stepwrap li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:8px;
     width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
     display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.ketluan{background:var(--success-soft);border:1.5px solid var(--success);border-radius:10px;padding:10px 14px;margin-top:10px}
.ketluan.canhbao{background:#FFF6E8;border-color:var(--warning)}
.pabadge{display:inline-block;font-size:13px;font-weight:800;border-radius:99px;padding:2px 10px;margin-left:6px}
.pabadge.da{background:var(--success-soft);color:var(--success);border:1px solid var(--success)}

/* ==== Trạm C ghép đôi ==== */
.pairwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.pairwrap{grid-template-columns:1fr}}
.pcol h4{margin:6px 0;font-size:15px;color:var(--text-2)}
.pairbtn{display:block;width:100%;text-align:left;min-height:var(--btn-h);margin:7px 0;padding:10px 12px;
     border-radius:12px;border:2px solid var(--border);background:var(--bg-1);font-size:15.5px;cursor:pointer;line-height:1.4}
.pairbtn:hover:not(:disabled):not(.done){border-color:var(--accent)}
.pairbtn.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.pairbtn.done{border-color:var(--success);background:var(--success-soft);cursor:default;color:var(--text-2)}
.pairbtn.wrong{animation:shake .35s;border-color:var(--error)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ==== Thẻ lật pha 3 — mỗi lần MỘT thẻ, chữ lớn, bấm lật qua lật lại ==== */
.fstage{display:flex;justify-content:center}
.flip{width:100%;max-width:560px;height:300px;perspective:1000px;cursor:pointer;outline-offset:3px}
.flip:focus-visible{outline:3px solid var(--accent);border-radius:14px}
.fin{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .fin{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:auto;
     border-radius:14px;border:2px solid var(--border);background:var(--bg-1);padding:20px 22px;
     display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px}
.fface .ftxt{margin:0;font-size:21px;line-height:1.5;font-weight:600}
.fback{transform:rotateY(180deg);background:var(--bg-2);border-color:var(--accent)}
.fback .ftxt{font-weight:500}
.ftag{font-size:13px;font-weight:800;color:var(--accent-strong);letter-spacing:.06em;text-transform:uppercase}
.fhint{font-size:13px;color:var(--text-2)}
.fnav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.fpos{font-weight:800;color:var(--text-2);min-width:130px;text-align:center}
@media (max-width:430px){
  .flip{height:330px}
  .fface{padding:16px}
  .fface .ftxt{font-size:19px}
  .fpos{min-width:110px}
}

/* ==== Huy hiệu / toast / chứng nhận ==== */
.hbrow{display:flex;gap:8px;flex-wrap:wrap}
.hb{display:flex;align-items:center;gap:7px;border:1.5px solid var(--border);border-radius:12px;
    padding:6px 10px;font-size:14px;background:var(--bg-1);opacity:.5}
.hb.co{opacity:1;border-color:var(--gold);background:#FFF8E1;font-weight:600}
.hb .ico{font-size:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:88px;z-index:70;
   background:var(--text-1);color:#fff;padding:10px 16px;border-radius:12px;font-size:15.5px;
   max-width:88vw;opacity:0;pointer-events:none;transition:.3s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.cert-card{border:3px double var(--accent-strong);border-radius:10px;background:#fff;
   max-width:560px;margin:0 auto;padding:28px 22px;text-align:center}
.cert-card .kicker{font-size:14px;letter-spacing:.22em;color:var(--accent-strong);font-weight:800}
.cert-card h2{margin:6px 0 2px;font-size:24px}
.cert-card .name{font-size:26px;font-weight:800;color:var(--accent-strong);margin:12px 0 2px;border-bottom:2px solid var(--border);display:inline-block;padding:0 18px 4px}
.cert-score{font-size:19px;margin:10px 0 2px}
.cert-hb{font-size:24px;letter-spacing:6px;margin:10px 0}
.cert-date{color:var(--text-2);font-size:15px;margin-top:8px}

/* ==== Cụm nút Xuất/Nạp cố định góc dưới phải ==== */
.fx{position:fixed;right:12px;bottom:12px;z-index:55;display:flex;flex-direction:column;gap:8px}
.fxbtn{min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--border);
   background:var(--bg-1);color:var(--accent-strong);font-size:15px;font-weight:700;cursor:pointer;
   box-shadow:0 2px 8px rgba(22,35,46,.14);line-height:1.2}
.fxbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
/* Màn hình hẹp dưới 430px: xếp ngang, chỉ hiện biểu tượng, không đè nút chính */
@media (max-width:429px){
  .fx{flex-direction:row}
  .fxbtn .lbl{display:none}
  .fxbtn{width:50px;padding:8px 0;font-size:19px;text-align:center}
}
#main{padding-bottom:150px} /* id để thắng độ đặc hiệu trước .wrap; chừa chỗ cho cụm nút góc */

/* ==== In chứng nhận ==== */
@media print{
  body{background:#fff}
  .topbar,.nav,.fx,#toast,.no-print{display:none!important}
  main{padding:0}
  .screen{display:none!important}
  #scr-cert{display:block!important}
  .cert-card{max-width:100%;border-width:3px;box-shadow:none;page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <h1>Hành trình Khởi nghĩa Lam Sơn</h1>
    <p class="sub">Lịch sử 7 · Mô hình học tập 5E · Hướng Trung học cơ sở</p>
    <div class="prog" aria-label="Tiến độ bài học"><i id="prog-bar"></i></div>
    <div class="badgebar" id="badgebar" aria-label="Huy hiệu"></div>
  </div>
</div>

<nav class="nav" id="nav" aria-label="Các pha của bài học"></nav>

<main class="wrap" id="main"></main>

<div class="fx">
  <button type="button" class="fxbtn" id="fx-xuat" onclick="xlXuat()"
          title="Xuất dữ liệu ra tệp .json" aria-label="Xuất dữ liệu">
    💾<span class="lbl"> Xuất dữ liệu</span></button>
  <button type="button" class="fxbtn" id="fx-nap" onclick="document.getElementById('napfile').click()"
          title="Nạp dữ liệu từ tệp .json đã xuất" aria-label="Nạp dữ liệu">
    📂<span class="lbl"> Nạp dữ liệu</span></button>
  <input type="file" id="napfile" accept=".json,application/json" hidden
         onchange="xlNapFile(this)">
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   DỮ LIỆU BÀI HỌC — giáo viên chỉ cần sửa trong vùng này.
   Nguồn: Bo5_LichSu7_NoiDungApp.xlsx. Không thêm số liệu ngoài tệp này.
   ===================================================================== */
/* ===DATA START=== */
const LESSON = {

      {ten:'Nước non đầu thế kỷ XV',

/* ===BALANCE START=== */
function demTu(s){ return s.trim().split(/\s+/).length; }
function bacDoDai(s){ const w=demTu(s); return w<=8?'A':w<=12?'B':'C'; }
function xaoTron(a){ a=[...a];
for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
return a; }

function xaoTronCanBang(quiz){
const viTri=[]; const lech=Math.floor(Math.random()*4);
for(let i=0;i<quiz.length;i++) viTri.push((i+lech)%4);
const t=xaoTron(viTri);
return quiz.map((q,i)=>{
const opts=xaoTron(q.distractors);
opts.splice(Math.min(t[i],opts.length),0,q.correct);
return { question:q.q, options:opts, correctIndex:opts.indexOf(q.correct), explanation:q.why||'' };
});
}

function kiemCanBang(quiz){
const c={A:0,B:0,C:0};
quiz.forEach(q=>c[bacDoDai(q.correct)]++);
const n=quiz.length, max=Math.max(c.A,c.B,c.C);
const nhieuOk=quiz.every(q=>q.distractors.every(d=>{const w=demTu(d);return w>=5&&w<=16;}));
const dat=(max/n)<=0.4 && nhieuOk;
console.assert(dat,'CAN BANG DAP AN CHUA DAT',c,{nhieuOk});
return { counts:c, pass:dat, nhieuOk };
}

function kiemTraXong(ph){
  let x=false;
  if(ph==='p1') x=S.p1.duDoan>=0;
  if(ph==='p2') x=S.p2.aDone&&S.p2.bSim[0]&&S.p2.bSim[1]&&S.p2.cDone;
  if(ph==='p3') x=S.p3.seen.every(Boolean)&&S.p3.k.done;

/* --- Bộ máy hoạt hình: bấm nút nào cũng dừng tự chạy; rời pha thì huỷ hẹn giờ --- */
function dungHen(){ if(A.timer){clearTimeout(A.timer); A.timer=null;} }
function henKhung(){
  dungHen();
  const n=LESSON.engage.kichBan.length;
  if(!S.p1.eChay||S.p1.eFrame>=n-1)return;
  A.timer=setTimeout(()=>{
    if(S.man!=='p1'){ dungHen(); return; }   /* rời pha thì dừng hẳn */
    S.p1.eFrame++;
    if(S.p1.eFrame>=n-1)S.p1.eChay=false;
    veP1(); henKhung();
  },E_NHIP);
}
function tayDieuKhien(){ S.p1.eChay=false; dungHen(); }
function p1TuDau(){ tayDieuKhien(); S.p1.eFrame=0; veP1(); }
function p1Lui(){ if(S.p1.eFrame<=0)return; tayDieuKhien(); S.p1.eFrame--; veP1(); }
function p1Tiep(){ const n=LESSON.engage.kichBan.length; if(S.p1.eFrame>=n-1)return; tayDieuKhien(); S.p1.eFrame++; veP1(); }
function p1Nhay(k){ tayDieuKhien(); S.p1.eFrame=Math.max(0,Math.min(k,LESSON.engage.kichBan.length-1)); veP1(); }
function p1BoQua(){ tayDieuKhien(); S.p1.eFrame=LESSON.engage.kichBan.length-1; veP1(); }

  if(S.p1.eChay){ S.p1.eChay=false; dungHen(); }
  else{ if(S.p1.eFrame>=LESSON.engage.kichBan.length-1)S.p1.eFrame=0; S.p1.eChay=true; }

/* Phím tắt: mũi tên trái/phải và phím cách; bỏ qua khi đang ở ô nhập liệu */
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;
  if(S.man==='p1'){
    if(ev.key===' '&&t&&t.tagName==='BUTTON')return;  /* nút đang focus tự xử lý phím cách */
    if(ev.key==='ArrowRight'){ ev.preventDefault(); p1Tiep(); }
    else if(ev.key==='ArrowLeft'){ ev.preventDefault(); p1Lui(); }
    else if(ev.key===' '){ ev.preventDefault(); p1DoiChayDung(); }
  }else if(S.man==='p3'&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){
    /* đổi thẻ bằng phím mũi tên khi con trỏ đang ở khung thẻ (không phải nút khác) */
    const trongKhu=!t||t===document.body||t.id==='f-the'||(t.closest&&t.closest('#f-khu')!==null);
    if(trongKhu){ ev.preventDefault(); if(ev.key==='ArrowRight')theSau(); else theTruoc(); }
  }
});

function veMocA(){
  const M=LESSON.explore.tramA, y=S.p2.aMax;

  const cuoi=ds[ds.length-1];

  const cur=(S.p2.aMoc>=0&&M.mocNam[S.p2.aMoc]===M.mocNam[cuoi])?S.p2.aMoc:cuoi;

  S.p2.aMoc=cur;

    ` <span class="small">· Diễn biến ${pos+1}/${gr.length}</span>
      <button type="button" class="btn ghost" style="min-height:34px;padding:2px 12px" onclick="aMocDoi(-1)" aria-label="Diễn biến trước">‹</button>

function aMocDoi(d){
  const M=LESSON.explore.tramA, y=S.p2.aMax;

  let pos=gr.indexOf(S.p2.aMoc)+d;
  pos=Math.max(0,Math.min(gr.length-1,pos));
  S.p2.aMoc=gr[pos]; veMocA();
}

/* =====================================================================
   PHẦN CÂU HỎI DÙNG CHUNG (pha 3, pha 4, pha 5)
   ===================================================================== */
function quizHTML(p){
  const st=quizSt(p), L=st.list;
  if(st.done){
    const pct=Math.round(st.dung/L.length*100);
    let khoan='';
    if(p==='k5'){
      khoan=S.p5.best>=NAM_MO
        ?'<br>Bạn đã đạt ngưỡng chứng nhận (80%)! Bấm "Nhận chứng nhận" ở cuối trang.'
        :`<br>Còn thiếu ${NAM_MO-st.dung} câu đúng nữa để mở chứng nhận (cần ${NAM_MO}/${L.length} câu). Làm lại để nâng điểm nhé!`;
    }else{
      khoan='<br>Điểm không phải điều quan trọng nhất — quan trọng là bạn hiểu bài.';
    }
    return `<div class="ketluan"><b>Hoàn thành! Bạn trả lời đúng ${st.dung}/${L.length} câu (${pct}%).</b>${khoan}</div>
      <div class="row" style="margin-top:8px"><button type="button" class="btn ghost" onclick="xlLaiQuiz('${p}')">Làm lại bộ này</button></div>`;
  }
  const q=L[st.idx];
  const opts=q.options.map((o,i)=>{
    let cls='opt';
    if(st.traLoi){ if(i===q.correctIndex)cls+=' ok'; else if(i===st.chon)cls+=' ko'; }
    return `<button type="button" class="${cls}" ${st.traLoi?'disabled':''} onclick="xlTraLoi('${p}',${i})">
      <span class="och">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const fb=st.traLoi?`
    <p class="${st.chon===q.correctIndex?'feedback-ok':'feedback-ko'}">${st.chon===q.correctIndex?'Chính xác! 🎉':'Chưa đúng — đừng lo, cùng xem giải thích nhé.'}</p>
    <div class="why"><b>Giải thích:</b> ${esc(q.explanation)}</div>
    <button type="button" class="btn pri" onclick="xlCauTiep('${p}')">${st.idx===L.length-1?'Xem kết quả':'Câu tiếp theo'}</button>`:'';
  return `<p class="qmeta">Câu ${st.idx+1}/${L.length} · Số câu đúng: ${st.dung}</p>
    <p class="q">${esc(q.question)}</p>${opts}${fb}`;
}
function rerenderQuiz(p){ const e=document.getElementById('qz-'+p); if(e)e.innerHTML=quizHTML(p); }
function xlTraLoi(p,i){
  const st=quizSt(p); if(st.traLoi||st.done)return;
  st.chon=i; st.traLoi=true;
  if(i===st.list[st.idx].correctIndex){ S.streak++; st.dung++; if(S.streak>=5)thuongHuyHieu('hb3'); }
  else{ S.streak=0; st.coSai=true; }
  rerenderQuiz(p);
}
function xlCauTiep(p){
  const st=quizSt(p); if(!st.traLoi)return;
  st.traLoi=false; st.chon=-1;
  if(st.idx>=st.list.length-1){ st.done=true; onQuizDone(p); }
  else st.idx++;
  rerenderQuiz(p); capNhatCtaKhung();
}
function xlLaiQuiz(p){
  const st=quizSt(p);
  st.list=xaoTronCanBang(nguonQuiz(p));
  st.idx=0; st.chon=-1; st.traLoi=false; st.dung=0; st.coSai=false; st.done=false;
  if(p==='k5'){ S.p5.time=0; const e=document.getElementById('p5-time'); if(e)e.textContent=fmtT(0); batHen5(); }
  rerenderQuiz(p); capNhatCtaKhung();
  toast('Bộ câu hỏi mới đã sẵn sàng!');
}
function onQuizDone(p){
  const st=quizSt(p);
  if(st.coSai)thuongHuyHieu('hb4');   /* sai mà vẫn làm hết — không bỏ cuộc */
  if(p==='k5'){
    dungHen5();
    if(st.dung>S.p5.best){ S.p5.best=st.dung; S.p5.bestDate=new Date().toISOString(); }
  }
  kiemTraXong(p==='k3'?'p3':p==='k5'?'p5':'p4');
  kiemHuyHieu();
}

          <span class="fhint">👆 Bấm vào thẻ để lật xem ví dụ</span></div>
        <div class="fface fback"><span class="ftag">Ví dụ đời thường</span>
          <p class="ftxt">${esc(c.back)}</p>
          <span class="fhint">Bấm một lần nữa để lật lại ý chính</span></div>
      </div>
    </div>
  </div>
  <div class="fnav">
    <button type="button" class="btn" id="f-prev" onclick="theTruoc()"${i===0?' disabled':''}>‹ Thẻ trước</button>
    <div class="fpos" id="f-pos" aria-live="polite">Thẻ ${i+1} trên 12</div>
    <button type="button" class="btn" id="f-next" onclick="theSau()"${i===LESSON.flashcards.length-1?' disabled':''}>Thẻ sau ›</button>
  </div>
  <div class="dots" id="f-dots" role="group" aria-label="Chọn nhanh từng thẻ">${LESSON.flashcards.map((_,k)=>
    `<button type="button" class="dot${k===i?' cur':(S.p3.seen[k]?' seen':'')}" aria-label="Tới thẻ ${k+1}" onclick="theNhay(${k})"></button>`).join('')}</div>`;
}
function veThe(){ const e=document.getElementById('f-khu'); if(e)e.innerHTML=theKhuHTML(); }
function xlLatThe(){
  const el=document.getElementById('f-the'); if(!el)return;
  S.p3.lat=!S.p3.lat;                          /* lật qua lật lại nhiều lần */
  el.classList.toggle('on',S.p3.lat);
  el.setAttribute('aria-pressed',String(S.p3.lat));
  if(S.p3.lat&&!S.p3.seen[S.p3.cur]){          /* lần đầu lật tới mặt sau mới tính là đã xem */
    S.p3.seen[S.p3.cur]=true;
    const n=S.p3.seen.filter(Boolean).length;
    const c=document.getElementById('f-count');
    if(c)c.textContent=`Đã xem ${n}/12 thẻ.`;
    const d=document.querySelectorAll('#f-dots .dot')[S.p3.cur];
    if(d)d.classList.add('seen');
    kiemTraXong('p3'); capNhatCtaKhung();
  }
}
function theTruoc(){ if(S.p3.cur<=0)return; S.p3.cur--; S.p3.lat=false; veThe(); }
function theSau(){ if(S.p3.cur>=LESSON.flashcards.length-1)return; S.p3.cur++; S.p3.lat=false; veThe(); }
function theNhay(k){ S.p3.cur=Math.max(0,Math.min(LESSON.flashcards.length-1,k|0)); S.p3.lat=false; veThe(); }

/* =====================================================================
   PHA 4 · VẬN DỤNG — hai tình huống, mỗi tình huống ba câu
   ===================================================================== */
function vP4(){
  return `<div class="screen" id="scr-p4">
  <div class="card">
    <h2>Pha 4 · Vận dụng <span class="doi">Bài học của nghĩa quân giúp gì cho bạn?</span></h2>
    <p class="lead">Hai tình huống quen thuộc của tuổi 11–15. Trả lời từng câu, sẽ có giải thích.</p>
  </div>
  <div class="card">
    <h2>Tình huống 1 · Áp lực mùa thi ${S.p4.s1.done?'<span class="pabadge da">✓</span>':''}</h2>
    <p>${esc(LESSON.useCases[0].boiCanh)}</p>
    <div id="qz-s1">${quizHTML('s1')}</div>
  </div>
  <div class="card">
    <h2>Tình huống 2 · Một lần thất bại trong cuộc thi của trường ${S.p4.s2.done?'<span class="pabadge da">✓</span>':''}</h2>
    <p>${esc(LESSON.useCases[1].boiCanh)}</p>
    <div id="qz-s2">${quizHTML('s2')}</div>
  </div>
  ${ctaHTML('p5','Tiếp: Pha 5 — Đánh giá')}
  </div>`;
}
function sauP4(){ capNhatCtaKhung(); }

/* =====================================================================
   PHA 5 · ĐÁNH GIÁ — 15 câu + đồng hồ ĐẾM LÊN có nút tắt
   ===================================================================== */
function fmtT(s){ const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
function vP5(){
  return `<div class="screen" id="scr-p5">
  <div class="card">
    <h2>Pha 5 · Đánh giá <span class="doi">15 câu</span></h2>
    <div class="timerchip" id="p5-timer">⏱ <span id="p5-time">${fmtT(S.p5.time)}</span>
      <button type="button" class="btn ghost" id="p5-tg" onclick="xlTatHen()">${S.p5.timerOn?'Tắt đồng hồ':'Bật đồng hồ'}</button></div>
    <p class="lead">Làm bình tĩnh. Đồng hồ chỉ để bạn tự đua với chính mình, không ảnh hưởng tới điểm.</p>
    <div id="qz-k5">${quizHTML('k5')}</div>
  </div>
  ${ctaHTML('cert','Nhận chứng nhận')}
  </div>`;
}
function sauP5(){
  if(!S.p5.started){ S.p5.started=true; S.p5.time=0; }
  batHen5();
  capNhatCtaKhung();
}
function batHen5(){
  dungHen5();
  if(S.p5.k.done)return;
  T5.iv=setInterval(()=>{
    S.p5.time++;
    const e=document.getElementById('p5-time');
    if(e&&S.p5.timerOn)e.textContent=fmtT(S.p5.time);   /* mỗi giây chỉ đổi ô số */
  },1000);
}
function dungHen5(){ if(T5.iv){ clearInterval(T5.iv); T5.iv=null; } }
function xlTatHen(){
  S.p5.timerOn=!S.p5.timerOn;
  const e=document.getElementById('p5-time'), b=document.getElementById('p5-tg');
  if(e)e.style.visibility=S.p5.timerOn?'visible':'hidden';
  if(b)b.textContent=S.p5.timerOn?'Tắt đồng hồ':'Bật đồng hồ';
  toast(S.p5.timerOn?'Đã bật lại đồng hồ.':'Đã tắt đồng hồ — bạn yên tâm làm bài.');
}

/* =====================================================================
   CHỨNG NHẬN — mở khoá khi đạt từ 80% (12/15 câu) trở lên
   ===================================================================== */
function vCert(){
  if(!(S.xong.p5&&S.p5.best>=NAM_MO)){
    return `<div class="screen" id="scr-cert"><div class="card">
      <h2>Chứng nhận chưa mở 🔒</h2>
      <p class="lead">Cần đạt từ 80% (12/15 câu) ở pha Đánh giá để mở chứng nhận. Bạn cứ quay lại pha 5 và làm lại nhé!</p>
      <button type="button" class="btn" onclick="show('p5')">Về pha 5</button></div></div>`;
  }
  const pct=Math.round(S.p5.best/15*100);
  const hbIcons=LESSON.huyHieu.filter(h=>S.hb[h.id]).map(h=>h.ico).join(' ')||'—';
  const ngay=new Date().toLocaleDateString('vi-VN');
  return `<div class="screen" id="scr-cert">
  <div class="card no-print">
    <h2>Chúc mừng bạn! 🎉</h2>
    <p class="lead">Bạn đã đi hết năm pha và đạt ${pct}% ở phần đánh giá. Nhận chứng nhận nào!</p>
    <div class="row">
      <button type="button" class="btn pri" onclick="window.print()">🖨️ In chứng nhận</button>
      <button type="button" class="btn ghost" onclick="show('p5')">Về pha 5</button>
    </div>
  </div>
  <div class="cert-card">
    <div class="kicker">GIẤY CHỨNG NHẬN</div>
    <h2>Hành trình Khởi nghĩa Lam Sơn</h2>
    <p class="small">Lịch sử 7 · Mô hình học tập 5E</p>
    <p style="margin:10px 0 0">Trao cho</p>
    <div class="name">${esc(S.hoTen||'Học sinh')}</div>
    <p class="small">Lớp: ${esc(S.lop||'—')}</p>
    <p class="cert-score">Hoàn thành cả năm pha · Đánh giá: <b>${S.p5.best}/15 câu đúng (${pct}%)</b></p>
    <div class="cert-hb">${hbIcons}</div>
    <p class="cert-date">Ngày ${ngay}</p>
  </div>
  </div>`;
}

/* =====================================================================
   NÚT CỐ ĐỊNH: XUẤT / NẠP DỮ LIỆU .json
   ===================================================================== */
function xlXuat(){
  try{
    const data={app:LESSON.meta.app, phienBan:1, xuatLuc:new Date().toISOString(), tenBai:LESSON.meta.title, trangThai:S};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=('LamSon_LichSu7_'+(S.hoTen||'hocsinh')).replace(/[^\w\-]/g,'_')+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Đã xuất dữ liệu ra tệp .json — hãy giữ tệp này nhé.');
  }catch(e){ toast('Không xuất được tệp trên trình duyệt này.'); }
}
function xlNapFile(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>napTuText(String(r.result));
  r.onerror=()=>toast('Không đọc được tệp.');
  r.readAsText(f);
  inp.value='';
}
function napTuText(txt){
  try{
    const d=JSON.parse(txt);
    if(!d||d.app!==LESSON.meta.app||!d.trangThai)throw new Error('sai-dinh-dang');
    S=ghepTrangThai(trangThaiGoc(),d.trangThai);
    S.p1.eChay=false;               /* nạp xong: hoạt hình ở chế độ dừng */
    sinhDsCauHoi();
    veNav(); veMan(); window.scrollTo(0,0);
    toast('Đã nạp dữ liệu — tiếp tục hành trình nhé!');
  }catch(e){ toast('Tệp không đọc được. Hãy chọn đúng tệp .json đã xuất.'); }
}
function ghepTrangThai(g,n){
  ['man','hoTen','lop','streak'].forEach(k=>{ if(typeof n[k]===typeof g[k])g[k]=n[k]; });
  if(n.xong)Object.keys(g.xong).forEach(k=>{ if(typeof n.xong[k]==='boolean')g.xong[k]=n.xong[k]; });
  if(n.hb)Object.keys(g.hb).forEach(k=>{ if(typeof n.hb[k]==='boolean')g.hb[k]=n.hb[k]; });
  const sao=(g0,n0,keys)=>keys.forEach(k=>{ if(n0&&typeof n0[k]===typeof g0[k])g0[k]=n0[k]; });
  if(n.p1)sao(g.p1,n.p1,['eFrame','daTuChay','duDoan']);
  if(n.p2){
    sao(g.p2,n.p2,['aMax','aDone','bSel','cSel','cDone']);
    if(Array.isArray(n.p2.bSteps)&&n.p2.bSteps.length===2)g.p2.bSteps=n.p2.bSteps.slice();
    if(Array.isArray(n.p2.bSim)&&n.p2.bSim.length===2)g.p2.bSim=n.p2.bSim.slice();
    if(Array.isArray(n.p2.cOrder)&&n.p2.cOrder.length===3)g.p2.cOrder=n.p2.cOrder.slice();
    if(Array.isArray(n.p2.cPair)&&n.p2.cPair.length===3)g.p2.cPair=n.p2.cPair.slice();
    if(typeof n.p2.aMoc==='number')g.p2.aMoc=n.p2.aMoc;
  }
  if(n.p3){
    if(Array.isArray(n.p3.seen)&&n.p3.seen.length===12)g.p3.seen=n.p3.seen.slice();
    sao(g.p3,n.p3,['cur','lat']);
    g.p3.cur=Math.max(0,Math.min(11,g.p3.cur|0));
  }
  const gq=(gq0,nq0)=>{
    if(!nq0||typeof nq0!=='object')return;
    gq0.idx=nq0.idx|0; gq0.chon=(typeof nq0.chon==='number')?nq0.chon:-1;
    gq0.traLoi=!!nq0.traLoi; gq0.dung=nq0.dung|0; gq0.coSai=!!nq0.coSai; gq0.done=!!nq0.done;
    if(Array.isArray(nq0.list)&&nq0.list.length&&nq0.list.every(x=>x&&typeof x.question==='string'&&Array.isArray(x.options)&&typeof x.correctIndex==='number'))gq0.list=nq0.list;
  };
  gq(g.p3.k,n.p3&&n.p3.k); gq(g.p4.s1,n.p4&&n.p4.s1); gq(g.p4.s2,n.p4&&n.p4.s2); gq(g.p5.k,n.p5&&n.p5.k);
  if(n.p5){
    sao(g.p5,n.p5,['time','timerOn','started','best','bestDate']);
    if(typeof g.p5.best!=='number'||g.p5.best<0)g.p5.best=0;
  }
  return g;
}

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
function capNhatCtaKhung(){
  const b=document.getElementById('cta-btn'); if(!b)return;
  let ok=false, nhan='', goi='';
  if(S.man==='p1'){ ok=S.p1.duDoan>=0; nhan='Tiếp: Pha 2 — Khám phá'; goi='Chọn một mức dự đoán để mở nút này.'; }
  else if(S.man==='p2'){ ok=S.xong.p2; nhan='Tiếp: Pha 3 — Giải thích'; goi='Hãy hoàn thành cả ba trạm A, B, C nhé.'; }
  else if(S.man==='p3'){ ok=S.xong.p3; nhan='Tiếp: Pha 4 — Vận dụng'; goi='Hãy lật xem đủ cả 12 thẻ và trả lời hết 15 câu.'; }
  else if(S.man==='p4'){ ok=S.xong.p4; nhan='Tiếp: Pha 5 — Đánh giá'; goi='Trả lời hết câu hỏi của cả hai tình huống nhé.'; }
  else if(S.man==='p5'){
    ok=S.xong.p5&&S.p5.best>=NAM_MO; nhan='Nhận chứng nhận';
    goi=ok?'':`Còn thiếu ${NAM_MO-S.p5.best} câu đúng nữa để mở chứng nhận (cần ${NAM_MO}/15 câu).`;
  }
  b.disabled=!ok; b.textContent=nhan;
  const h=document.getElementById('cta-hint'); if(h)h.textContent=goi;
}

function khoiDong(){
  sinhDsCauHoi();
  kiemCanBang(LESSON.knowledgeQuiz);   /* kiểm cân bằng đáp án — hai bộ câu hỏi lớn */
  kiemCanBang(LESSON.finalQuiz);
  veNav(); veMan();
}
/* Móc nối kiểm tra ngoài (bảng điều khiển): chạy kiemCanBang(LESSON.knowledgeQuiz) và
   kiemCanBang(LESSON.finalQuiz) để nghiệm thu cân bằng đáp án; __TrangThai() xem trạng thái. */
window.LESSON=LESSON;
window.__TrangThai=()=>S;
khoiDong();
</script>
